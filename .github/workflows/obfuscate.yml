name: Generate and Obfuscate Worker Script

on:
  workflow_dispatch:
  push:
    branches:
      - '**'  # 仅匹配分支推送，排除标签推送
    paths:
      - '明文源吗'
      - 'build-obfuscate.js'
      - '.github/workflows/obfuscate.yml'

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install build dependencies
        run: npm ci

      - name: Build multi-stage obfuscated script
        run: node build-obfuscate.js 0.5 0.2

      - name: Verify output file
        run: |
          if [ ! -s "少年你相信光吗" ]; then
            echo "错误：混淆产物 少年你相信光吗 为空或不存在。"
            exit 1
          fi
          if ! grep -q "export" "少年你相信光吗"; then
            echo "错误：混淆产物缺少 export default，无法作为 Worker 模块部署。"
            exit 1
          fi
          echo "混淆产物校验通过。"

      - name: Commit and push the obfuscated file
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add '少年你相信光吗'
          if git diff --staged --quiet; then
            echo "No changes to commit, the obfuscated file is already up-to-date."
          else
            git commit -m "部署用这个"
            git push
          fi
